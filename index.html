    </aside>

        <a class="brand mobile-brand" href="#/works">
          <span class="brand-mark" aria-hidden="true">▶</span><span>MY ANIME STUDIO</span>
        </a>
        <div id="breadcrumb" class="breadcrumb"></div>
        <span class="storage-status"><span aria-hidden="true"></span>このブラウザに保存</span>
      </header>
      <main id="main" aria-busy="true"><p>スタジオを開いています…</p></main>
    </div>

  </div>

      </header>

      <p id="editor-error" class="form-error" role="alert" hidden></p>
      <footer class="dialog-actions">
        <button type="button" class="button secondary" data-action="close">キャンセル</button>
        <button type="submit" class="button primary" id="editor-submit">保存する</button>
      </footer>

<script>
'use strict';

const backupMagic = 'MASTUDIO1';
const backupEncoder = new TextEncoder();
const backupDecoder = new TextDecoder('utf-8', { fatal: true });
const backupHeaderSize = backupMagic.length + 4;
const backupManifestLimit = 16_000_000;
let backupUrl;

function backupPanel(onlyExport = false) {
  return `<section class="film-panel" aria-labelledby="backup-title">
    <h2 id="backup-title">バックアップ</h2>
    <p>このブラウザの全作品と素材をファイルに保存できます。${onlyExport ? '' : '復元は作品のコピーを追加します。'}</p>
    <div class="row-actions">
      ${action('バックアップを作成', 'backup-export')}
      ${onlyExport ? '' : action('ファイルから復元', 'backup-import')}
      <a id="backup-download" class="button primary" download="my-anime-studio.mastudio" hidden>バックアップをダウンロード</a>
    </div>
  </section>`;
}

async function createBackup() {
  const { projects, assets } = await transaction(['projects', 'assets'], 'readonly', async tx => {
    const [projects, assets] = await Promise.all(['projects', 'assets'].map(name => result(tx.objectStore(name).getAll())));
    return { projects, assets };
  });
  const manifest = backupEncoder.encode(JSON.stringify({
    projects,
    assets: assets.map(({ blob, ...asset }) => ({ ...asset, size: blob.size, type: blob.type })),
  }));
  if (manifest.length > backupManifestLimit) throw new Error('作品データがバックアップの上限を超えました。');
  const header = new Uint8Array(backupHeaderSize);
  header.set(backupEncoder.encode(backupMagic));
  new DataView(header.buffer).setUint32(backupMagic.length, manifest.length);
  return new Blob([header, manifest, ...assets.map(asset => asset.blob)], { type: 'application/octet-stream' });
}

async function showBackupDownload() {
  const file = await createBackup();
  const link = document.getElementById('backup-download');
  if (!link) return;
  if (backupUrl) URL.revokeObjectURL(backupUrl);
  backupUrl = URL.createObjectURL(file);
  link.href = backupUrl;
  link.hidden = false;
  link.focus();
  notify('バックアップをダウンロードできます。');
}

function validateBackup(condition) {
  if (!condition) throw new Error('バックアップの形式が正しくないか、ファイルが破損しています。');
}

const validBackupId = value => typeof value === 'string' && /^[a-zA-Z0-9-]{1,100}$/.test(value);
const validBackupText = value => typeof value === 'string';
const validBackupTextFields = (record, ...keys) => keys.every(key => validBackupText(record?.[key]));

function uniqueBackupIds(rows) {
  return Array.isArray(rows) && rows.every(row => validBackupId(row?.id))
    && new Set(rows.map(row => row.id)).size === rows.length;
}

async function parseBackup(file) {
  validateBackup(file?.size >= backupHeaderSize);
  const header = await file.slice(0, backupHeaderSize).arrayBuffer();
  validateBackup(backupDecoder.decode(header.slice(0, backupMagic.length)) === backupMagic);
  const length = new DataView(header).getUint32(backupMagic.length);
  let offset = backupHeaderSize + length;
  validateBackup(length > 0 && length <= backupManifestLimit && offset <= file.size);
  const { projects, assets } = JSON.parse(backupDecoder.decode(await file.slice(backupHeaderSize, offset).arrayBuffer()));
  validateBackup(uniqueBackupIds(projects) && uniqueBackupIds(assets) && projects.length > 0);
  const copies = new Map(projects.map(project => [project.id, id()]));
  const assetIds = new Map();
  const restoredAssets = assets.map(asset => {
    const { id: oldId, projectId, kind, name, size, type, createdAt } = asset;
    validateBackup(copies.has(projectId) && ['image', 'audio', 'video'].includes(kind)
      && typeof name === 'string' && typeof type === 'string' && type.startsWith(kind + '/')
      && Number.isFinite(createdAt) && Number.isSafeInteger(size) && size > 0 && offset + size <= file.size);
    const blob = file.slice(offset, offset + size, type);
    offset += size;
    const assetId = id();
    const candidate = asset.aiCandidate === undefined ? null : restoreAiCandidate(asset.aiCandidate, kind);
    assetIds.set(oldId, { assetId, projectId, kind, library: candidate?.adopted !== false });
    return { id: assetId, projectId: copies.get(projectId), kind, name, blob, createdAt,
      ...(candidate ? { aiCandidate: candidate } : {}) };
  });

  validateBackup(offset === file.size);
  const restoredProjects = projects.map(project => {
    const remap = (key, kinds) => {
      const asset = assetIds.get(key);
      return asset?.projectId === project.id && asset.library && kinds.includes(asset.kind) ? asset.assetId : '';
    };
    validateBackup(validBackupTextFields(project, 'title', 'genre', 'summary')
      && uniqueBackupIds(project.scenes) && uniqueBackupIds(project.characters) && uniqueBackupIds(project.boards)
      && project.scenes.every(scene => validBackupTextFields(scene, 'title', 'place', 'notes'))
      && project.characters.every(character => validBackupTextFields(character, 'name', 'role', 'appearance', 'notes'))
      && project.boards.every(board => validBackupTextFields(board, 'title', 'sceneId', 'imageId', 'camera', 'notes')));
    const copy = {
      id: copies.get(project.id), title: project.title + '（復元）', genre: project.genre, summary: project.summary,
      scenes: project.scenes,
      characters: project.characters.map(character => ({
        ...character,
        referenceIds: (Array.isArray(character.referenceIds) ? character.referenceIds : [])
          .map(key => remap(key, ['image'])).filter(Boolean),
      })),
      boards: project.boards.map(board => ({ ...board, imageId: remap(board.imageId, ['image']) })),
    };
    if (project.film || project.id === sample.id) copy.film = restoreFilm(filmOf(project), remap);
    if (project.aiVideoRequests !== undefined) copy.aiVideoRequests = restoreAiRequests(project.aiVideoRequests, copy, remap);
    return copy;
  });
  return { projects: restoredProjects, assets: restoredAssets };
}

  dialog('バックアップを復元', `

'use strict';

const filmDuration = 10;
const defaultCutTenths = [30, 30, 40];
const shotLabels = ['歩く', '振り向く', '話す・表情'];
const filmJobLabels = { motion: '動画生成', lipsync: 'リップシンク' };
const mouthShapes = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'X'];

function defaultFilm(project) {
  const characterId = project.id === sample.id && project.characters.some(character => character.id === 'akari') ? 'akari' : '';
  return {
    shots: shotLabels.map((_, index) => ({
      visualId: '', audioId: '', audioOffset: 0, characterId,
      line: project.id === sample.id && index === 2 ? '零番駅…ここにいるの？' : '', cues: [],
    })),
    jobs: [],
  };
}

const filmOf = project => project.film ?? defaultFilm(project);
const editableFilm = project => project.film ??= defaultFilm(project);

function filmShotStarts(film) {
  const cuts = film.cutTenths ?? defaultCutTenths;
  return [0, cuts[0] / 10, (cuts[0] + cuts[1]) / 10, filmDuration];
}

function formatFilmSeconds(seconds) {
  return Number(seconds.toFixed(1)).toString();
}

function fitFilmCut(film, index, seconds) {
  const cuts = film.cutTenths ?? defaultCutTenths;
  const total = filmDuration * 10;
  const target = Math.max(10, Math.ceil(seconds * 10 - .000001));
  const minimums = film.shots.map(shot => Math.max(10, Math.floor(shot.audioOffset * 10 + .000001) + 1));
  const [first, second] = [0, 1, 2].filter(cut => cut !== index);
  const remaining = total - target - minimums[first] - minimums[second];
  if (target < minimums[index] || remaining < 0) {
    throw new Error('この長さでは各カットを1秒以上確保し、現在の音声開始位置を保てません。尺の調整をオフにするか、短いMP4を選んでください。');
  }
  const unused = cuts[first] + cuts[second] - minimums[first] - minimums[second];
  const proportion = unused > 0 ? (cuts[first] - minimums[first]) / unused : .5;
  const firstShare = Math.round(remaining * proportion);
  const fitted = [...cuts];
  fitted[index] = target;
  fitted[first] = minimums[first] + firstShare;
  fitted[second] = minimums[second] + remaining - firstShare;
  film.cutTenths = fitted;
}

function validMouthCues(cues) {
  return Array.isArray(cues) && cues.length <= 2000 && cues.every((cue, index) =>
    Number.isFinite(cue?.start) && Number.isFinite(cue.end) && cue.start >= 0 && cue.start < cue.end
    && cue.end <= 600 && (!index || cue.start >= cues[index - 1].end - 0.001)
    && mouthShapes.includes(cue.value));
}

function restoreFilm(film, remap) {
  validateBackup(Array.isArray(film.shots) && film.shots.length === 3 && uniqueBackupIds(film.jobs));
  if (film.cutTenths !== undefined) {
    validateBackup(Array.isArray(film.cutTenths) && film.cutTenths.length === 3
      && film.cutTenths.every(value => Number.isInteger(value) && value >= 10)
      && film.cutTenths.reduce((sum, value) => sum + value, 0) === filmDuration * 10);
  }
  const starts = filmShotStarts(film);
  return {
    ...(film.cutTenths ? { cutTenths: film.cutTenths } : {}),
    shots: film.shots.map((shot, index) => {
      validateBackup(validBackupTextFields(shot, 'line', 'characterId', 'visualId', 'audioId') && validMouthCues(shot.cues)
        && Number.isFinite(shot.audioOffset) && shot.audioOffset >= 0 && shot.audioOffset < starts[index + 1] - starts[index]);
      return {
        ...shot, visualId: remap(shot.visualId, ['image', 'video']), audioId: remap(shot.audioId, ['audio']),
      };
    }),
    jobs: film.jobs.map(job => {
      validateBackup(Object.hasOwn(filmJobLabels, job.kind) && [0, 1, 2].includes(job.shot)
        && validBackupTextFields(job, 'prompt', 'resultId'));
      return { ...job, resultId: remap(job.resultId, ['video']) };
    }),
  };
}

function detachFilmAsset(project, assetId) {
  for (const character of project.characters) {
    if (character.referenceIds) character.referenceIds = character.referenceIds.filter(key => key !== assetId);
  }
  if (!project.film) return;
  for (const shot of project.film.shots) {
    if (shot.visualId === assetId) shot.visualId = '';
    if (shot.audioId === assetId) shot.audioId = '';
  }
  for (const job of project.film.jobs) if (job.resultId === assetId) job.resultId = '';
}

function assetOptions(assets, kinds) {
  return assets.filter(asset => kinds.includes(asset.kind)).map(asset => [asset.id, asset.name]);
}

function filmSelect(name, label, options, value, emptyLabel = '未選択') {
  return `<label class="field">${label}<select name="${name}"><option value="">${emptyLabel}</option>${options.map(([key, text]) =>
    `<option value="${escapeHtml(key)}"${key === value ? ' selected' : ''}>${escapeHtml(text)}</option>`).join('')}</select></label>`;
}

async function linkedFilmAsset(store, projectId, assetId, kinds) {
  if (!assetId) return '';
  const asset = await result(store.get(assetId));
  if (asset?.projectId !== projectId || !kinds.includes(asset.kind) || asset.aiCandidate?.adopted === false) {
    throw new Error('選んだ素材が見つかりません。もう一度選び直してください。');
  }
  return assetId;
}

function editFilmShot(index) {
  if (![0, 1, 2].includes(index)) return;
  const { project, assets } = state;
  const film = filmOf(project);
  const shot = film.shots[index];
  const starts = filmShotStarts(film);
  const duration = formatFilmSeconds(starts[index + 1] - starts[index]);
  dialog(`${shotLabels[index]}のカット`, `
    ${filmSelect('characterId', 'キャラクター', project.characters.map(row => [row.id, row.name]), shot.characterId)}
    ${filmSelect('visualId', '映像素材', assetOptions(assets, ['image', 'video']), shot.visualId, 'デモ作画')}
    ${filmSelect('audioId', '音声素材', assetOptions(assets, ['audio']), shot.audioId, '音声なし')}
    <label class="field">カットの先頭から音声を遅らせる秒数
      <input name="audioOffset" type="number" min="0" max="${formatFilmSeconds(duration - .1)}" step=".1" value="${shot.audioOffset}" required>
    </label>
    <label class="field">セリフ・字幕<textarea name="line" maxlength="100" rows="2">${escapeHtml(shot.line)}</textarea></label>
    <p class="form-hint">動画は先頭から再生し、短い場合は最後のフレームで止まります。動画の元音声は使わず、選んだ音声素材を使用します。</p>`,
    async values => {
      const audioOffset = Number(values.get('audioOffset'));
      if (!Number.isFinite(audioOffset) || audioOffset < 0 || audioOffset >= duration) throw new Error('音声の開始位置を確認してください。');
      await changeProject(project.id, async (current, store) => {
        const currentFilm = editableFilm(current);
        const currentStarts = filmShotStarts(currentFilm);
        if (audioOffset >= Number(formatFilmSeconds(currentStarts[index + 1] - currentStarts[index]))) {
          throw new Error('カットの長さが変更されました。音声の開始位置を確認してください。');
        }
        const characterId = values.get('characterId');
        if (characterId && !current.characters.some(row => row.id === characterId)) throw new Error('キャラクターが見つかりません。');
        const [visualId, audioId] = await Promise.all([
          linkedFilmAsset(store, current.id, values.get('visualId'), ['image', 'video']),
          linkedFilmAsset(store, current.id, values.get('audioId'), ['audio']),
        ]);
        Object.assign(currentFilm.shots[index], { characterId, visualId, audioId, audioOffset, line: values.get('line').trim() });
      });
      return 'カットを保存しました。';
    });
}

function editFilmCues(index) {
  if (![0, 1, 2].includes(index)) return;
  const { project } = state;
  const count = filmOf(project).shots[index].cues.length;
  dialog('リップシンクの口形データ', `
    <label class="field">Rhubarb Lip SyncのJSONファイル<input type="file" name="cues" accept=".json,application/json"></label>
    ${count ? '<label class="film-check"><input type="checkbox" name="clear">保存済みの口形データを解除</label>' : ''}
    <p class="form-hint">別のツールで作成したJSONを読み込み、デモ作画の口に反映します。口形の時刻は音声の開始位置が基準です。${count ? ` 登録済み：${count}件。` : ''}</p>`,
    async values => {
      const file = values.get('cues');
      let cues = [];
      if (file.size) {
        if (file.size > 250_000) throw new Error('口形データは250 KBまでです。');
        try { cues = JSON.parse(await file.text())?.mouthCues; } catch { /* Invalid JSON is reported below. */ }
        if (!validMouthCues(cues) || !cues.length) throw new Error('有効なmouthCuesを含むRhubarbのJSONを選んでください。');
        cues = cues.map(({ start, end, value }) => ({ start, end, value }));
      } else if (!values.has('clear')) throw new Error('JSONを選ぶか、解除にチェックを入れてください。');
      await changeProject(project.id, current => { editableFilm(current).shots[index].cues = cues; });
      return '口形データを更新しました。';
    });
}

'use strict';

function restoreAiCandidate(candidate, kind) {
  validateBackup(kind === 'video' && candidate && ['file', 'wan'].includes(candidate.origin)
    && typeof candidate.adopted === 'boolean' && Number.isFinite(candidate.seconds) && candidate.seconds > 0
    && (candidate.draftId === '' || validBackupId(candidate.draftId)));
  return { origin: candidate.origin, adopted: candidate.adopted, seconds: candidate.seconds, draftId: candidate.draftId };
}

async function addAiCandidate(projectId, draftId, origin, name, video) {
  await changeProject(projectId, (project, store) => {
    const draft = aiRequests(project).find(request => request.id === draftId);
    return result(store.add({
      id: id(), projectId, name, kind: 'video', blob: video.mp4, createdAt: Date.now(),
      aiCandidate: { draftId: draft?.id ?? '', origin, adopted: false, seconds: video.seconds },
    }));
  });
}

function importAiCandidate(draftId) {
  const { project, assets } = state;
  if (draftId && !aiRequests(project).some(request => request.id === draftId)) return;
  const videos = assets.filter(asset => asset.kind === 'video' && (asset.blob.type === 'video/mp4' || /\.mp4$/i.test(asset.name)));
  dialog('MP4を候補に追加', `
    <label class="field">スマホのMP4ファイル<input type="file" name="mp4" accept=".mp4,video/mp4"></label>
    ${videos.length ? filmSelect('sourceId', 'または作品内のMP4', assetOptions(videos, ['video']), '') : ''}
    <p class="form-hint">25 MBまで。追加後、候補動画の一覧で再生できます。</p>`,
    async values => {
      const file = values.get('mp4');
      const source = videos.find(asset => asset.id === values.get('sourceId'));
      if (file.size && source) throw new Error('スマホのファイルか作品内のMP4のどちらかを選択してください。');
      const video = await readImportedMp4(file.size ? file : source?.blob);
      await addAiCandidate(project.id, draftId, 'file', file.size ? file.name : source.name, video);
      return '候補に追加しました。「候補動画」で試写できます。';
    }, '候補に追加');
}

async function readCandidate(store, projectId, candidateId, adopted = false) {
  const asset = await result(store.get(candidateId));
  if (asset?.projectId !== projectId || !asset.aiCandidate || (adopted && !asset.aiCandidate.adopted)) {
    throw new Error('この候補は利用できません。');
  }
  return asset;
}

async function adoptAiCandidate(candidateId) {
  await changeProject(state.project.id, async (project, store) => {
    const asset = await readCandidate(store, project.id, candidateId);
    asset.aiCandidate.adopted = true;
    await result(store.put(asset));
  });
  await render();
  notify('採用した動画を素材に保存しました。');
}

function placeAiCandidate(candidateId) {
  const project = state.project;
  const asset = state.candidates.find(candidate => candidate.id === candidateId);
  if (!asset?.aiCandidate.adopted) return;
  const film = filmOf(project);
  const starts = filmShotStarts(film);
  const request = aiRequests(project).find(row => row.id === asset.aiCandidate.draftId);
  const suggestedCut = { turn: 1, talk: 2 }[request?.actionPreset] ?? 0;
  const options = shotLabels.map((label, index) => [String(index),
    `${label}（${formatFilmSeconds(starts[index + 1] - starts[index])}秒）`]);
  dialog('10秒編集に配置', `
    ${filmSelect('shot', '配置先のカット', options, String(request?.shot ?? suggestedCut))}
    <label class="film-check"><input type="checkbox" name="fit">MP4の長さに合わせて各カットの尺を調整</label>
    <p class="form-hint">映像だけを差し替えます。前の素材、音声、字幕は保存されます。尺を調整すると他のカットの長さも変わります。</p>`,
    async values => {
      const selected = values.get('shot');
      if (!['0', '1', '2'].includes(selected)) throw new Error('配置先を選択してください。');
      const index = Number(selected);
      await changeProject(project.id, async (current, store) => {
        const selectedAsset = await readCandidate(store, current.id, candidateId, true);
        const currentFilm = editableFilm(current);
        if (values.has('fit')) fitFilmCut(currentFilm, index, selectedAsset.aiCandidate.seconds);
        currentFilm.shots[index].visualId = selectedAsset.id;
        const target = aiRequests(current).find(row => row.id === selectedAsset.aiCandidate.draftId);
        if (target) Object.assign(target, { resultId: selectedAsset.id, shot: index });
      });
      location.hash = href('film', project.id);
      return `${shotLabels[index]}のカットに配置しました。`;
    }, 'タイムラインに配置');
}

function removeAiCandidate(candidateId) {
  const projectId = state.project.id;
  const asset = state.candidates.find(candidate => candidate.id === candidateId);
  if (!asset) return;
  const adopted = asset.aiCandidate.adopted;
  dialog(adopted ? '候補一覧から外す' : '候補を削除', adopted
    ? '<p class="form-hint">素材として保存した動画は引き続き使えます。</p>'
    : '<p class="form-hint">試写用の動画を削除します。</p>',
  async () => {
    await changeProject(projectId, async (project, store) => {
      const current = await readCandidate(store, project.id, candidateId);
      if (current.aiCandidate.adopted || adopted) {
        delete current.aiCandidate;
        await result(store.put(current));
      } else await result(store.delete(candidateId));
    });
    return adopted ? '候補一覧から外しました。' : '候補を削除しました。';
  }, adopted ? '一覧から外す' : '削除する', true);
}

'use strict';

const wanProviderOrigin = 'https://prithivmlmods-wan2-2-fast.hf.space';
const wanProviderApi = wanProviderOrigin + '/gradio_api';
const wanProviderPage = 'https://huggingface.co/spaces/prithivMLmods/Wan2.2-Fast';
const wanMessageLimit = 35_000_000;
const wanReports = new Map();
let wanActiveRun;

function aiProviderStatus(projectId) {
  const message = wanReports.get(projectId) ?? '操作時に無料枠を確認します。満枠・停止時はMP4を取り込めます。';
  return `<div class="ai-head"><span class="film-offline">Wan 2.2 外部接続・試験運用</span></div>
    <p id="ai-provider-note" role="status">${escapeHtml(message)}</p>`;
}

function setWanReport(projectId, message) {
  wanReports.set(projectId, message);
  if (state?.project.id === projectId && state.view === 'ai') {
    const note = document.getElementById('ai-provider-note');
    if (note) note.textContent = message;
  }
}

function wanRequest(path, signal, options) {
  return fetch(wanProviderApi + path, {
    ...options, mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
    redirect: 'error', signal,
  });
}

function wanHttpError(status) {
  if ([401, 403].includes(status)) {
    return new Error('公開の匿名生成が利用できません。提供側の利用条件を確認するか、MP4を取り込んでください。');
  }
  if (status === 429) return new Error('無料枠の上限に達しました。枠の更新を待つか、MP4を取り込んでください。');
  return new Error(`生成サービスに接続できませんでした（HTTP ${status}）。MP4の取り込みは利用できます。`);
}

function parseWanEvent(event) {
  const lines = event.split(/\r?\n/);
  const kind = lines.find(line => line.startsWith('event:'))?.slice(6).trim();
  if (kind === 'error') {
    const detail = lines.filter(line => line.startsWith('data:')).map(line => line.slice(5)).join('\n');
    if (/quota|rate limit|free limit/i.test(detail)) throw wanHttpError(429);
    throw new Error('外部サービスで生成が失敗しました。無料枠や混雑の状況を確認するか、MP4を取り込んでください。');
  }
  if (kind !== 'complete') return null;
  const data = JSON.parse(lines.filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n'));
  const encoded = data?.[0]?.video;
  const prefix = 'data:video/mp4;base64,';
  if (typeof encoded !== 'string' || !encoded.startsWith(prefix)) throw new Error('外部サービスからMP4が返りませんでした。');
  const base64 = encoded.slice(prefix.length);
  if (base64.length > 33_333_336) throw new Error('生成結果が25 MBの素材上限を超えています。');
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  return new Blob([bytes], { type: 'video/mp4' });
}

async function readWanEvents(response) {
  if (!response.body || !response.headers.get('content-type')?.includes('text/event-stream')) {
    throw new Error('外部サービスの待ち行列に接続できませんでした。');
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let pending = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      pending += decoder.decode(value, { stream: !done });
      if (pending.length > wanMessageLimit) throw new Error('生成結果が25 MBの素材上限を超えています。');
      let separator = /\r?\n\r?\n/.exec(pending);
      while (separator) {
        const blob = parseWanEvent(pending.slice(0, separator.index));
        if (blob) return blob;
        pending = pending.slice(separator.index + separator[0].length);
        separator = /\r?\n\r?\n/.exec(pending);
      }
      if (done) {
        const blob = parseWanEvent(pending);
        if (blob) return blob;
        throw new Error('動画を受け取る前に外部接続が終了しました。');
      }
    }
  } finally {
    void reader.cancel().catch(() => {});
  }
}

function dataImage(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error('送信画像を読み込めません。'));
    reader.readAsDataURL(blob);
  });
}

async function runWanGeneration({ projectId, draftId, prompt, seconds, image }) {
  if (wanActiveRun) throw new Error('別の生成結果を待っています。');
  const controller = new AbortController();
  wanActiveRun = controller;
  const timer = setTimeout(() => controller.abort(), 150000);
  setWanReport(projectId, '外部サービスに送信しています…');
  try {
    const imageData = await dataImage(image);
    const args = [imageData, prompt, 4, aiAvoid, seconds, 1, 1, 0, true];
    const queued = await wanRequest('/call/generate_video', controller.signal, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: args }),
    });
    if (!queued.ok) throw wanHttpError(queued.status);
    const reply = await queued.json();
    if (typeof reply.event_id !== 'string' || !/^[\w-]{1,128}$/.test(reply.event_id)) throw new Error('外部サービスが生成依頼を受け付けませんでした。');
    setWanReport(projectId, '無料GPUの待ち行列・生成結果を待っています。このタブを開いたままにしてください。');
    const events = await wanRequest('/call/generate_video/' + reply.event_id, controller.signal);
    if (!events.ok) throw wanHttpError(events.status);
    const video = await readImportedMp4(await readWanEvents(events));
    await addAiCandidate(projectId, draftId, 'wan', `wan22-${Date.now()}.mp4`, video);
    setWanReport(projectId, '無料生成に成功しました。「候補動画」で試写できます。');
    const stillOnPage = () => state?.project.id === projectId && state.view === 'ai';
    if (stillOnPage()) {
      if (editor.open) editor.addEventListener('close', () => {
        if (stillOnPage()) void render().catch(error => notify(report(error)));
      }, { once: true });
      else await render();
    }
  } catch (error) {
    setWanReport(projectId, controller.signal.aborted
      ? '結果の待機時間を超えました。自動で再送信しません。MP4を取り込むこともできます。'
      : error instanceof TypeError ? '外部サービスに接続できません。通信や無料枠を確認してください。'
      : (error?.name === 'QuotaExceededError' ? 'ブラウザの空き容量が不足しています。' : report(error)));
  } finally {
    clearTimeout(timer);
    wanActiveRun = undefined;
  }
}

async function openWanImage(asset) {
  const url = URL.createObjectURL(asset.blob);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    return image;
  } catch {
    throw new Error('参照画像または背景画像を読み込めません。PNGかJPEGを選んでください。');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function drawWanImage(context, image, width, height, cover = false) {
  const scaleX = width / image.naturalWidth;
  const scaleY = height / image.naturalHeight;
  const scale = cover ? Math.max(scaleX, scaleY) : Math.min(scaleX, scaleY);
  const w = scale * image.naturalWidth;
  const h = scale * image.naturalHeight;
  context.drawImage(image, (context.canvas.width - w) / 2, (context.canvas.height - h) / 2, w, h);
}

function hasTransparentArea(image) {
  const sample = document.createElement('canvas');
  sample.width = sample.height = 50;
  const context = sample.getContext('2d');
  context.drawImage(image, 0, 0, 50, 50);
  const pixels = context.getImageData(0, 0, 50, 50).data;
  let transparent = 0;
  for (let index = 3; index < pixels.length; index += 4) if (pixels[index] < 16) transparent += 1;
  return transparent >= 125 && transparent < 2375;
}

async function buildWanReference(reference, background) {
  const [subject, backdrop] = await Promise.all([openWanImage(reference), background && openWanImage(background)]);
  const canvas = document.createElement('canvas');
  canvas.width = 832;
  canvas.height = 480;
  const context = canvas.getContext('2d');
  context.fillStyle = '#202334';
  context.fillRect(0, 0, canvas.width, canvas.height);
  if (backdrop) {
    if (!hasTransparentArea(subject)) {
      throw new Error('背景画像を重ねるには透明部分のあるキャラクター画像を選んでください。背景付きの参照画像を使う場合は、背景画像の指定を解除できます。');
    }
    drawWanImage(context, backdrop, canvas.width, canvas.height, true);
    drawWanImage(context, subject, canvas.width * .82, canvas.height * .90);
  } else drawWanImage(context, subject, canvas.width, canvas.height);
  return new Promise((resolve, reject) => canvas.toBlob(blob => {
    if (blob) resolve(blob);
    else reject(new Error('送信画像の作成に失敗しました。'));
  }, 'image/png'));
}

async function showWanGenerate(draftId) {
  if (wanActiveRun) throw new Error('別の生成結果を待っています。');
  const { project, assets } = state;
  const request = aiRequests(project).find(row => row.id === draftId);
  if (!request) return;
  const character = project.characters.find(row => row.id === request.characterId);
  const reference = assets.find(asset => asset.id === request.referenceId && character?.referenceIds?.includes(asset.id));
  const background = assets.find(asset => asset.id === request.backgroundId);
  if (!reference) throw new Error('下書きを編集し、キャラクターに登録済みの参照画像を選んでください。');
  const locationBefore = location.hash;
  const image = await buildWanReference(reference, background);
  if (editor.open || location.hash !== locationBefore || state?.project.id !== project.id) return;
  const url = URL.createObjectURL(image);
  const prompt = aiPrompt(request, character);
  dialog('外部サービスに生成を依頼', `
    <img class="wan-reference" src="${url}" alt="外部に送る最初のフレーム">
    <label class="field">送信する指示<textarea readonly rows="5">${escapeHtml(prompt)}</textarea></label>
    <p class="form-hint">画像1枚と上の指示を Hugging Face のコミュニティSpaceに送信します。無料枠の空きや出力品質は提供側に依存します。 <a href="${wanProviderPage}" target="_blank" rel="noopener noreferrer">送信先を確認</a></p>
    <label class="film-check"><input type="checkbox" name="consent" required>この画像と指示を外部サービスに送信する</label>`,
    async values => {
      if (!values.has('consent')) throw new Error('送信する画像と指示を確認してください。');
      if (wanActiveRun) throw new Error('別の生成結果を待っています。');
      void runWanGeneration({ projectId: project.id, draftId, prompt, seconds: request.seconds, image });
      return '外部生成をリクエストしました。';
    }, '無料枠で生成を依頼');
  editor.addEventListener('close', () => URL.revokeObjectURL(url), { once: true });
}

  sit: ['座る', '既にある椅子の位置を確認し、足裏をつけたまま腰と膝を曲げる。腰が座面に触れるまで自然に減速し、姿勢が安定してから手を膝に置く。'],

};
const aiAngles = {
  profile: '真横・全身', front: '正面・全身', threeQuarter: '斜め45度・全身', close: '正面・胸から上',
};
const aiAvoid = '強い前傾、足の滑り、足が浮く、余分な手足、顔や髪や衣装の変形、背景や床の歪み、急なカメラ移動、カット切替、字幕。';

function aiRequests(project) {
  return project.aiVideoRequests ?? [];
}

function restoreAiRequests(requests, project, remap) {
  validateBackup(uniqueBackupIds(requests));
  return requests.map(request => {
    validateBackup(validBackupTextFields(request, 'characterId', 'referenceId', 'motion', 'background', 'camera', 'resultId')
      && aiClipLengths.includes(request.seconds) && [null, 0, 1, 2].includes(request.shot));
    const character = project.characters.find(row => row.id === request.characterId);
    const reference = remap(request.referenceId, ['image']);
    const resultId = remap(request.resultId, ['video']);
    return {
      id: request.id, characterId: character?.id ?? '', referenceId: character?.referenceIds?.includes(reference) ? reference : '',
      motion: request.motion, background: request.background, camera: request.camera, seconds: request.seconds,
      actionPreset: Object.hasOwn(aiActions, request.actionPreset) ? request.actionPreset : '',
      angle: Object.hasOwn(aiAngles, request.angle) ? request.angle : '',
      backgroundId: remap(request.backgroundId, ['image']),
      resultId, shot: resultId ? request.shot : null,
    };
  });
}

function detachAiAsset(project, assetId) {
  for (const request of aiRequests(project)) {
    if (request.referenceId === assetId) request.referenceId = '';
    if (request.backgroundId === assetId) request.backgroundId = '';
    if (request.resultId === assetId) {
      request.resultId = '';
      request.shot = null;
    }
  }
}

function detachAiCharacter(project, characterId) {
  for (const request of aiRequests(project)) {
    if (request.characterId === characterId) {
      request.characterId = '';
      request.referenceId = '';
    }
  }
}

function aiPrompt(request, character) {
  return [
    `日本の2D手描きアニメ映画風の単一カット。長さ ${request.seconds} 秒、16:9。`,
    character ? `キャラクター：${character.name}。` : '',
    '参照画像と同じ顔、輪郭、髪型、衣装、体格、配色を全フレームで保つ。',
    `動作：${request.motion}`,
    request.background && `背景：${request.background}`,
    request.angle && `カメラアングル：${aiAngles[request.angle]}`,
    request.camera && `カメラワーク：${request.camera}`,
    '元の背景・床・照明の位置関係を保つ。指定がなければ固定カメラ。',
    `避けること：${aiAvoid}`,
  ].filter(Boolean).join('\n');
}

async function readImportedMp4(blob) {
  if (!blob?.size || blob.size > 25_000_000) throw new Error('25 MB以下のMP4ファイルを選択してください。');
  const bytes = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
  if (bytes.length < 12 || String.fromCharCode(...bytes.slice(4, 8)) !== 'ftyp') {
    throw new Error('有効なMP4ファイルを選択してください。');
  }
  const mp4 = blob.slice(0, blob.size, 'video/mp4');
  const url = URL.createObjectURL(mp4);
  const video = document.createElement('video');
  video.preload = 'metadata';
  try {
    const seconds = await new Promise((resolve, reject) => {
      const error = () => reject(new Error('このブラウザで読めないMP4です。H.264で保存し直した動画を選んでください。'));
      const timer = setTimeout(error, 10000);
      video.onloadedmetadata = () => {
        clearTimeout(timer);
        if (video.videoWidth && Number.isFinite(video.duration) && video.duration > 0) resolve(video.duration);
        else error();
      };
      video.onerror = () => {
        clearTimeout(timer);
        error();
      };
      video.src = url;
    });
    return { mp4, seconds };
  } finally {
    video.removeAttribute('src');
    video.load();
    URL.revokeObjectURL(url);
  }
}

'use strict';

const filmFrameRate = 24;
const filmMimeTypes = {
  mp4: ['video/mp4;codecs=avc1.42001f,mp4a.40.2', 'video/mp4'],
  webm: ['video/webm;codecs=vp8,opus', 'video/webm'],
};
let filmPlayer;

function filmRecorderType(format) {
  if (typeof MediaRecorder === 'undefined' || !HTMLCanvasElement.prototype.captureStream) return '';
  return filmMimeTypes[format].find(type => MediaRecorder.isTypeSupported(type)) ?? '';
}

function roundedFill(ctx, x, y, w, h, radius, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fill();
}

function filmPath(ctx, points, color, width) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.stroke();
}

function filmEllipse(ctx, x, y, width, height, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, width, height, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawStation(ctx) {
  const sky = ctx.createLinearGradient(0, 0, 0, 720);
  sky.addColorStop(0, '#111329');
  sky.addColorStop(.62, '#222b46');
  sky.addColorStop(1, '#101a2a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, 1280, 720);
  ctx.fillStyle = '#182138';
  ctx.fillRect(0, 350, 1280, 72);
  for (let index = 0; index < 10; index += 1) {
    const x = index * 150 - 55;
    ctx.fillStyle = '#2b3655';
    ctx.fillRect(x, 160 + index % 3 * 26, 100, 172 - index % 3 * 26);
    for (let windowIndex = 0; windowIndex < 4; windowIndex += 1) {
      ctx.fillStyle = windowIndex % 2 ? '#53456d' : '#356375';
      ctx.fillRect(x + 12 + windowIndex * 21, 280 - index % 3 * 12, 11, 10);
    }
  }
  filmPath(ctx, [[0, 417], [1280, 417]], '#45687f', 6);
  ctx.fillStyle = '#233148';
  ctx.fillRect(0, 495, 1280, 225);
  filmPath(ctx, [[0, 505], [1280, 505]], '#92a4a5', 3);
  filmPath(ctx, [[0, 552], [1280, 552]], '#534966', 4);
  for (let index = 0; index < 18; index += 1) {
    const x = index * 80 - 40;
    filmPath(ctx, [[640 + (x - 640) * .23, 495], [x, 720]], '#2c3a52', 2);
  }
  roundedFill(ctx, 934, 109, 224, 77, 12, '#15192b');
  ctx.fillStyle = '#85d6cb';
  ctx.font = '600 29px sans-serif';
  ctx.fillText('零番駅', 966, 158);
  filmPath(ctx, [[1140, 147], [1118, 147], [1127, 140]], '#85d6cb', 3);
}

function drawDemoActor(ctx, index, t, cue) {
  const walk = index === 0;
  const turning = index === 1;
  const phase = walk ? t * Math.PI * 2 * 1.65 : 0;
  const step = walk ? Math.sin(phase) : 0;
  const headTurn = turning ? Math.min(1, Math.max(0, (t - .55) / 1.15)) : Number(!walk);
  const easedTurn = headTurn * headTurn * (3 - 2 * headTurn);
  const scale = index === 2 ? 1.42 : 1;
  const x = walk ? 346 + t * 95 : 630;
  const baseline = index === 2 ? 730 : 581;
  const expression = index === 2 ? Math.min(1, Math.max(0, (t - 1.4) / .8)) : 0;
  filmEllipse(ctx, x, baseline + 3, 76 * scale, 12 * scale, '#121b2b');
  ctx.save();
  ctx.translate(x, baseline - Math.abs(step) * 6);
  ctx.scale(scale, scale);
  for (const side of [-1, 1]) {
    const swing = side * step;
    const lift = walk ? Math.max(0, Math.cos(phase) * side) * 18 : 0;
    const foot = side * 19 + 44 * swing;
    filmPath(ctx, [[side * 17, -118], [side * 20 + swing * 21, -62 - lift * .5], [foot, -13 - lift]], side < 0 ? '#2b2a42' : '#3d3953', 23);
    filmPath(ctx, [[foot - 8, -6 - lift], [foot + 20, -6 - lift]], '#191b29', 14);
  }
  filmPath(ctx, [[-36, -208], [-41 - step * 13, -170], [-35 - step * 24, -143]], '#a68670', 17);
  roundedFill(ctx, -36, -226, 72, 116, 26, '#b7987a');
  filmPath(ctx, [[-9, -202], [6, -191], [6, -119]], '#d9b69a', 4);
  filmPath(ctx, [[30, -205], [44 + step * 10, -175], [44 + step * 23, -143]], '#c8a789', 16);
  filmEllipse(ctx, 44 + step * 23, -140, 7, 9, '#eac2a1');
  ctx.save();
  ctx.translate(6 * (1 - easedTurn), -258);
  filmEllipse(ctx, 0, 0, 37 + easedTurn * 3, 46, '#252338');
  filmEllipse(ctx, 11 * (1 - easedTurn), 6, 28 + easedTurn * 3, 35, '#edc1a1');
  filmPath(ctx, [[-23, -21], [-7, -31], [14, -22], [28, -15]], '#292437', 13);
  const blink = Math.abs((t + .9) % 2.45 - 2.14) < .065;
  const eyeHeight = blink ? 1 : 4 + expression * 2;
  if (headTurn > .27) filmEllipse(ctx, -13 * easedTurn, 1, 3, eyeHeight, '#282238');
  filmEllipse(ctx, 20 - easedTurn * 6, 1, 3, eyeHeight, '#282238');
  filmPath(ctx, [[10, -10 - expression * 5], [20, -11 - expression * 6]], '#644451', 2);
  const [mw, mh] = ({ A: [5, 2], B: [8, 2], C: [8, 4], D: [8, 8], E: [5, 6], F: [3, 6],
    G: [8, 3], H: [5, 3], X: [5, 1] })[cue ?? 'X'];
  if (!cue && expression > .5) {
    filmPath(ctx, [[7, 19], [12, 22], [17, 18]], '#823f54', 2);
  } else {
    filmEllipse(ctx, 13 - easedTurn * 9, 19, mw, mh, '#823f54');
  }
  ctx.restore();
  ctx.restore();
}

function drawFilmSubtitle(ctx, line) {
  if (!line) return;
  ctx.font = '600 32px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lines = [];
  let current = '';
  for (const char of line) {
    if (char === '\n' || ctx.measureText(current + char).width > 1050) {
      lines.push(current);
      current = char === '\n' ? '' : char;
    } else current += char;
  }
  if (current) lines.push(current);
  const visible = lines.slice(0, 3);
  const startY = 665 - (visible.length - 1) * 44;
  visible.forEach((text, index) => {
    const width = ctx.measureText(text).width + 44;
    const y = startY + index * 44;
    roundedFill(ctx, (1280 - width) / 2, y - 21, width, 42, 7, 'rgba(10, 12, 24, .82)');
    ctx.fillStyle = '#fff7ec';
    ctx.fillText(text, 640, y);
  });
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function drawFilmFrame(player, time, playing = false) {
  const index = time < player.starts[1] ? 0 : time < player.starts[2] ? 1 : 2;
  const localTime = time - player.starts[index];
  const shot = player.film.shots[index];
  const ctx = player.ctx;
  const clip = player.clips.get(index);
  const video = clip?.tagName === 'VIDEO' ? clip : null;
  if (player.activeVideo !== video) {
    player.activeVideo?.pause();
    player.activeVideo = video;
    if (video && playing) {
      video.currentTime = Math.min(localTime, Math.max(0, video.duration - .033));
      video.play().catch(() => {
        if (filmPlayer === player && player.abort) {
          player.error = new Error('動画素材を再生できませんでした。対応形式の素材に変更してください。');
          player.abort.abort();
        }
      });
    }
  }
  if (video && !playing && video.readyState >= 2) {
    const position = Math.min(localTime, Math.max(0, video.duration - .033));
    if (Math.abs(video.currentTime - position) > .045) video.currentTime = position;
  }

  if (!shot.visualId) {
    const voiceTime = localTime - shot.audioOffset;
    const cue = shot.cues.find(row => voiceTime >= row.start && voiceTime < row.end)?.value;
    drawStation(ctx);
    drawDemoActor(ctx, index, localTime, cue);
  } else {
    ctx.fillStyle = '#131425';
    ctx.fillRect(0, 0, 1280, 720);
    if (clip && (!video || video.readyState >= 2)) {
      const width = video ? video.videoWidth : clip.naturalWidth;
      const height = video ? video.videoHeight : clip.naturalHeight;
      const scale = Math.min(1280 / width, 720 / height);
      if (width && height) ctx.drawImage(clip, (1280 - width * scale) / 2, (720 - height * scale) / 2, width * scale, height * scale);
    }
  }
  drawFilmSubtitle(ctx, shot.line);
  player.time = time;
  player.range.value = time;
  player.clock.textContent = `${time.toFixed(2)} / 10.00 秒`;
}

function loadFilmClip(player, index, asset) {
  const element = asset.kind === 'video' ? document.createElement('video') : new Image();
  const video = asset.kind === 'video';
  if (video) {
    element.preload = 'auto';
    element.muted = true;
    element.playsInline = true;
    element.addEventListener('seeked', () => {
      if (!player.abort && filmPlayer === player) drawFilmFrame(player, player.time);
    });
  }
  const url = URL.createObjectURL(asset.blob);
  player.urls.push(url);
  return new Promise((resolve, reject) => {
    const loadedEvent = video ? 'loadeddata' : 'load';
    const timer = setTimeout(() => done(false), 10000);
    function done(success) {
      clearTimeout(timer);
      element.removeEventListener(loadedEvent, loaded);
      element.removeEventListener('error', failed);
      if (success) {
        player.clips.set(index, element);
        resolve();
      } else reject(new Error(`「${asset.name}」を読み込めません。このブラウザで再生できる素材に変更してください。`));
    }
    function loaded() { done(!video || Number.isFinite(element.duration)); }
    function failed() { done(false); }
    element.addEventListener(loadedEvent, loaded);
    element.addEventListener('error', failed);
    element.src = url;
  });
}

function mountFilmPreview({ project, assets }) {
  const canvas = document.getElementById('film-canvas');
  const film = filmOf(project);
  const player = {
    canvas, ctx: canvas.getContext('2d'), film, starts: filmShotStarts(film), assets: new Map(assets.map(asset => [asset.id, asset])),
    range: document.getElementById('film-time'), clock: document.getElementById('film-clock'),
    status: document.getElementById('film-status'), download: document.getElementById('film-download'),
    clips: new Map(), urls: [], activeVideo: null, time: 0, abort: null, error: null, outputUrl: '',
  };
  filmPlayer = player;
  player.range.addEventListener('input', () => drawFilmFrame(player, Number(player.range.value)));
  const supported = ['mp4', 'webm'].filter(format => filmRecorderType(format));
  for (const format of ['mp4', 'webm']) {
    main.querySelector(`[data-action="film-${format}"]`).disabled = !supported.includes(format);
  }
  player.readyStatus = supported.includes('mp4')
    ? '書き出し中は、この画面を開いたままにしてください。'
    : 'このブラウザはMP4の録画に対応していません。' + (supported.includes('webm') ? 'WebMは書き出せます。' : 'プレビューは利用できます。');
  player.status.textContent = player.readyStatus;
  drawFilmFrame(player, 0);
  player.ready = Promise.all(player.film.shots.map((shot, index) => {
    const asset = player.assets.get(shot.visualId);
    return asset ? loadFilmClip(player, index, asset) : undefined;
  })).then(() => {
    if (filmPlayer === player && !player.abort) drawFilmFrame(player, player.time);
  }).catch(error => {
    player.loadError = error;
    if (filmPlayer === player) player.status.textContent = report(error);
  });
}

function unmountFilmPreview() {
  if (!filmPlayer) return;
  const player = filmPlayer;
  filmPlayer = undefined;
  player.abort?.abort();
  player.activeVideo?.pause();
  for (const url of player.urls) URL.revokeObjectURL(url);
  if (player.outputUrl) URL.revokeObjectURL(player.outputUrl);
}

function filmBusy(player, busy) {
  player.range.disabled = busy;
  for (const label of ['play', 'mp4', 'webm', 'shot', 'cues', 'job-add', 'job-edit', 'job-result', 'job-remove']) {
    main.querySelectorAll(`[data-action="film-${label}"]`).forEach(button => {
      button.disabled = busy || (Object.hasOwn(filmMimeTypes, label) && !filmRecorderType(label));
    });
  }
}

function startFilmRecorder(player, format, audioStream) {
  const canvasStream = player.canvas.captureStream(filmFrameRate);
  try {
    const streams = [canvasStream, audioStream].filter(Boolean);
    const stream = new MediaStream(streams.flatMap(item => item.getTracks()));
    const recorder = new MediaRecorder(stream, { mimeType: filmRecorderType(format), videoBitsPerSecond: 3_000_000 });
    const chunks = [];
    const finished = new Promise((resolve, reject) => {
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = () => resolve(new Blob(chunks, { type: recorder.mimeType }));
      recorder.onerror = event => {
        reject(event.error ?? new Error('ブラウザの書き出し処理に失敗しました。'));
        player.error = new Error('ブラウザの書き出し処理に失敗しました。');
        player.abort?.abort();
      };
    });
    finished.catch(() => {});
    recorder.start();
    return {
      finished,
      stop() {
        if (recorder.state !== 'inactive') recorder.stop();
        for (const track of canvasStream.getTracks()) track.stop();
      },
    };
  } catch (error) {
    for (const track of canvasStream.getTracks()) track.stop();
    throw error;
  }
}

function waitFilmFrames(player, from, signal) {
  return new Promise(resolve => {
    const start = performance.now();
    let frame;
    function finish() {
      cancelAnimationFrame(frame);
      signal.removeEventListener('abort', finish);
      resolve();
    }
    function tick(now) {
      const time = Math.min(filmDuration, from + (now - start) / 1000);
      drawFilmFrame(player, time, true);
      if (time >= filmDuration) finish();
      else frame = requestAnimationFrame(tick);
    }
    if (signal.aborted) return resolve();
    signal.addEventListener('abort', finish, { once: true });
    frame = requestAnimationFrame(tick);
  });
}

async function scheduleFilmAudio(player, context, from, destination) {
  const loaded = await Promise.all(player.film.shots.map(async shot => {
    const asset = player.assets.get(shot.audioId);
    if (!asset) return null;
    try { return await context.decodeAudioData(await asset.blob.arrayBuffer()); }
    catch { throw new Error(`「${asset.name}」を音声として読み込めません。素材の形式を変更してください。`); }
  }));
  return () => {
    const now = context.currentTime;
    return loaded.flatMap((buffer, index) => {
      if (!buffer) return [];
      const start = player.starts[index] + player.film.shots[index].audioOffset;
      const offset = Math.max(0, from - start);
      const duration = Math.min(player.starts[index + 1] - Math.max(from, start), buffer.duration - offset);
      if (duration <= 0) return [];
      const node = context.createBufferSource();
      node.buffer = buffer;
      node.connect(destination);
      node.start(now + Math.max(0, start - from), offset, duration);
      return [node];
    });
  };
}

async function runFilm(format) {
  const player = filmPlayer;
  if (!player || player.abort) return;
  if (format && !filmRecorderType(format)) return;
  const abort = new AbortController();
  player.abort = abort;
  player.error = null;
  function handleHiddenPage() {
    if (!document.hidden || !format) return;
    player.error = new Error('画面が非表示になったため、書き出しを中止しました。この画面を開いたまま再試行してください。');
    abort.abort();
  }
  document.addEventListener('visibilitychange', handleHiddenPage);
  const from = !format && player.time < filmDuration ? player.time : 0;
  let context, recorder, destination, sources = [];
  filmBusy(player, true);
  player.status.textContent = '素材を準備しています…';
  try {
    if (player.film.shots.some(shot => shot.audioId)) {
      const AudioEngine = window.AudioContext ?? window.webkitAudioContext;
      if (!AudioEngine) throw new Error('このブラウザは音声の合成に対応していません。');
      context = new AudioEngine();
      await context.resume();
      destination = format ? context.createMediaStreamDestination() : context.destination;
    }
    await player.ready;
    if (player.loadError) throw player.loadError;
    if (abort.signal.aborted) return;
    const startAudio = context ? await scheduleFilmAudio(player, context, from, destination) : null;
    if (abort.signal.aborted) return;
    // Start the selected video from its current timeline position when playback begins.
    player.activeVideo?.pause();
    player.activeVideo = null;
    drawFilmFrame(player, from, true);
    if (format) {
      player.download.hidden = true;
      recorder = startFilmRecorder(player, format, destination?.stream);
    }
    if (startAudio) sources = startAudio();
    player.status.textContent = format ? `${format.toUpperCase()}を書き出しています…` : '再生中';
    await waitFilmFrames(player, from, abort.signal);
    if (player.error) throw player.error;
    if (abort.signal.aborted) {
      player.status.textContent = '停止しました。';
      return;
    }
    if (!recorder) {
      player.status.textContent = '再生が終了しました。';
      return;
    }

    recorder.stop();
    const blob = await recorder.finished;
    if (abort.signal.aborted) return;
    const signature = new Uint8Array(await blob.slice(0, 8).arrayBuffer());
    if (format === 'mp4' && String.fromCharCode(...signature.slice(4)) !== 'ftyp') {
      throw new Error('このブラウザで有効なMP4を作成できませんでした。対応する場合はWebMをお試しください。');
    }
    if (format === 'webm' && signature.slice(0, 4).join(',') !== '26,69,223,163') {
      throw new Error('このブラウザで有効なWebMを作成できませんでした。');
    }
    if (player.outputUrl) URL.revokeObjectURL(player.outputUrl);
    player.outputUrl = URL.createObjectURL(blob);
    player.download.href = player.outputUrl;
    player.download.download = `my-anime-studio-10s.${format}`;
    player.download.textContent = `${format.toUpperCase()}を保存`;
    player.download.hidden = false;
    player.status.textContent = '書き出しが完了しました。';
  } catch (error) {
    player.status.textContent = error?.name === 'Error' ? report(error) : 'ブラウザの再生または書き出し処理に失敗しました。';
  } finally {
    document.removeEventListener('visibilitychange', handleHiddenPage);
    recorder?.stop();
    sources.forEach(source => source.stop());
    destination?.stream?.getTracks().forEach(track => track.stop());
    if (context) void context.close().catch(() => {});
    player.activeVideo?.pause();
    player.abort = null;
    if (filmPlayer === player) {
      if (abort.signal.aborted && player.status.textContent === '素材を準備しています…') {
        player.status.textContent = player.error ? report(player.error) : '停止しました。';
      }
      filmBusy(player, false);
    }
  }
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
}

function id() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join('');
}

function storageName() {
  const directory = location.pathname.replace(/\/(?:index|backup)\.html$/, '/').replace(/\/+$/, '');
  // Project sites on the same GitHub Pages account share an origin.
  return directory && location.protocol !== 'file:'
    ? `my-anime-studio:${directory}`
    : 'my-anime-studio';
}

function openDatabase() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(storageName(), 1);
    request.onupgradeneeded = () => {
      if (backupOnly) {
        request.transaction.abort();
        return;
      }
      const db = request.result;
      db.createObjectStore('projects', { keyPath: 'id' }).add(sample);
      db.createObjectStore('assets', { keyPath: 'id' }).createIndex('projectId', 'projectId');
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('別のタブを閉じてから、ページを再読み込みしてください。'));
  });
}

function result(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function transaction(stores, mode, operate) {
  const tx = database.transaction(stores, mode);
  const finished = new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onabort = () => reject(tx.error ?? new Error('保存処理が中断されました。'));
  });

  try {
    const [value] = await Promise.all([operate(tx), finished]);
    return value;
  } catch (error) {
    try { tx.abort(); } catch { /* The transaction may have already ended. */ }
    throw error;
  }
}

function readStudio(projectId) {
  return transaction(['projects', 'assets'], 'readonly', async tx => {
    const projects = await result(tx.objectStore('projects').getAll());
    const project = projects.find(item => item.id === projectId)
      ?? projects.find(item => item.id === sample.id)
      ?? projects[0];
    const assets = await result(tx.objectStore('assets').index('projectId').getAll(project.id));
    assets.sort((a, b) => a.createdAt - b.createdAt || a.name.localeCompare(b.name, 'ja'));
    return { projects, project, assets: assets.filter(asset => !asset.aiCandidate || asset.aiCandidate.adopted),
      candidates: assets.filter(asset => asset.aiCandidate).reverse() };
  });
}

function changeProject(projectId, update) {
  return transaction(['projects', 'assets'], 'readwrite', async tx => {
    const projects = tx.objectStore('projects');
    const project = await result(projects.get(projectId));
    if (!project) throw new Error('この作品は見つかりません。');
    await update(project, tx.objectStore('assets'));
    return result(projects.put(project));
  });
}

  const view = Object.hasOwn(views, segment) ? segment : 'works';

  ],
};

const itemNames = { works: '作品', scenes: 'シーン', characters: 'キャラクター', boards: 'カット', assets: '素材' };

function fieldMarkup([key, label, type, required], defaults, data) {
  const value = defaults[key] ?? '';
  let control;
  if (type === 'textarea') {
    control = `<textarea name="${key}" maxlength="2000" rows="4">${escapeHtml(value)}</textarea>`;
  } else if (type === 'select') {
    const options = key === 'sceneId'
      ? data.project.scenes.map(scene => [scene.id, scene.title])
      : data.assets.filter(asset => asset.kind === 'image').map(asset => [asset.id, asset.name]);
    control = `<select name="${key}"><option value="">未設定</option>${options.map(([optionId, name]) =>
      `<option value="${optionId}"${optionId === value ? ' selected' : ''}>${escapeHtml(name)}</option>`).join('')}</select>`;
  } else {
    control = `<input type="text" name="${key}" maxlength="120" value="${escapeHtml(value)}"${required ? ' required' : ''}>`;
  }
  return `<label class="field">${label}${control}</label>`;
}

function dialog(title, content, save, buttonLabel = '保存する', destructive = false) {
  document.getElementById('editor-title').textContent = title;
  document.getElementById('editor-body').innerHTML = content;
  formError.hidden = true;
  submit.textContent = buttonLabel;
  submit.className = `button ${destructive ? 'danger' : 'primary'}`;
  saveEditor = save;
  editor.showModal();
  const firstField = form.querySelector('input, textarea, select');
  if (firstField && firstField.type !== 'file') firstField.focus();
}

function readFields(view, values) {
  return Object.fromEntries(fields[view].map(([name, label, , required]) => {
    const value = values.get(name).trim();
    if (required && !value) throw new Error(`${label}を入力してください。`);
    return [name, value];
  }));
}

async function checkBoardLinks(project, assets, entry) {
  if (entry.sceneId && !project.scenes.some(scene => scene.id === entry.sceneId)) {
    throw new Error('選んだシーンが見つかりません。別のシーンを選んでください。');
  }
  if (entry.imageId) {
    const image = await result(assets.get(entry.imageId));
    if (image?.projectId !== project.id || image.kind !== 'image') {
      throw new Error('選んだ画像が見つかりません。別の画像を選んでください。');
    }
  }
}

function editItem(view, itemId) {
  const data = state;
  const project = data.project;
  const item = !itemId ? null : view === 'works' ? project : project[view].find(entry => entry.id === itemId);
  if (itemId && !item) return;
  const message = item ? `${itemNames[view]}を更新しました。` : `${itemNames[view]}を追加しました。`;
  dialog(`${itemNames[view]}を${item ? '編集' : view === 'works' ? '作成' : '追加'}`,
    fields[view].map(field => fieldMarkup(field, item ?? {}, data)).join(''),
    async values => {
      const entry = readFields(view, values);
      if (view === 'works' && !item) {
        const newProject = { ...entry, id: id(), scenes: [], characters: [], boards: [] };
        await transaction(['projects'], 'readwrite', tx => result(tx.objectStore('projects').add(newProject)));
        location.hash = href('works', newProject.id);
      } else if (view === 'works') {
        await changeProject(project.id, current => Object.assign(current, entry));
      } else {
        await changeProject(project.id, async (current, assets) => {
          if (view === 'boards') await checkBoardLinks(current, assets, entry);
          if (!item) {
            current[view].push({ ...entry, id: id() });
            return;
          }
          const existing = current[view].find(row => row.id === itemId);
          if (!existing) throw new Error('編集するデータが見つかりません。');
          Object.assign(existing, entry);
        });
      }
      return message;
    });
}

function upload() {
  const projectId = state.project.id;
  dialog('素材を追加', `
    <label class="field">ファイルを選択
      <input type="file" name="files" accept="image/*,audio/*,video/*" multiple required>
    </label>
    <p class="form-hint">画像・音声・動画を複数選べます。1ファイル25 MBまで。このブラウザに保存されます。</p>`,
    async values => {
      const files = values.getAll('files');
      if (!files.length) throw new Error('ファイルを選択してください。');
      const assets = files.map(file => {
        const kind = file.type.split('/')[0];
        if (!['image', 'audio', 'video'].includes(kind) || !file.size) {
          throw new Error(`${file.name || '選択したファイル'}は対応形式の画像・音声・動画ではありません。`);
        }
        if (file.size > 25_000_000) throw new Error(`${file.name}が25 MBを超えています。`);
        return { id: id(), projectId, kind, name: file.name, blob: file, createdAt: Date.now() };
      });
      await changeProject(projectId, (_project, store) => Promise.all(assets.map(asset => result(store.add(asset)))));
      return `${assets.length}件の素材を追加しました。`;
    }, '追加する');
}

function removeItem(view, itemId) {
  const { project, assets } = state;
  const item = (view === 'assets' ? assets : project[view]).find(entry => entry.id === itemId);
  if (!item) return;
  const details = view === 'scenes' ? '関連する絵コンテのカットは残り、シーンの関連付けが解除されます。'
    : view === 'assets' ? '絵コンテ、参照画像、テストシーン、生成の下書きからの関連付けが解除されます。' : '';
  dialog(`${itemNames[view]}を削除`, `<p class="form-hint">「${escapeHtml(item.title ?? item.name)}」を削除します。${details}</p>`,
    async () => {
      await changeProject(project.id, async (current, store) => {
        if (view === 'assets') {
          await result(store.delete(itemId));
          for (const board of current.boards) if (board.imageId === itemId) board.imageId = '';
          detachFilmAsset(current, itemId);
          detachAiAsset(current, itemId);
          return;
        }
        current[view] = current[view].filter(entry => entry.id !== itemId);
        if (view === 'scenes') {
          for (const board of current.boards) if (board.sceneId === itemId) board.sceneId = '';
        }
        if (view === 'characters') {
          for (const shot of current.film?.shots ?? []) if (shot.characterId === itemId) shot.characterId = '';
          detachAiCharacter(current, itemId);
        }
      });
      return `${itemNames[view]}を削除しました。`;
    }, '削除する', true);
}

async function moveItem(view, itemId, delta) {
  const projectId = state.project.id;
  await changeProject(projectId, project => {
    const list = project[view];
    const index = list.findIndex(item => item.id === itemId);
    const nextIndex = index + delta;
    if (index < 0 || nextIndex < 0 || nextIndex >= list.length) return;
    [list[index], list[nextIndex]] = [list[nextIndex], list[index]];
  });
  await render();
  main.querySelector(`[data-action="edit"][data-id="${itemId}"]`)?.focus({ preventScroll: true });
  notify('並び順を更新しました。');
}

let submitting = false;
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (submitting) return;
  submitting = true;
  submit.disabled = true;
  formError.hidden = true;
  try {
    const message = await saveEditor(new FormData(form));
    editor.close();
    notify(message);
    await render().catch(error => notify(report(error)));
  } catch (error) {
    formError.textContent = report(error);
    formError.hidden = false;
  } finally {
    submitting = false;
    submit.disabled = false;
  }
});

editor.addEventListener('cancel', event => {
  if (submitting) event.preventDefault();
});

document.addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  const { action: verb, id: itemId } = button.dataset;
  if (verb === 'close') {
    if (!submitting) editor.close();
    return;
  }
  try {
    if (verb === 'backup-export') {
      button.disabled = true;
      try { await showBackupDownload(); } finally { button.disabled = false; }
      return;
    }
    if (!state) return;
    const { view } = state;
    if (verb === 'backup-import') importBackup();
    else if (verb === 'ai-draft' || verb === 'ai-walking') editAiDraft(itemId, verb === 'ai-walking');
    else if (verb === 'ai-prompt') showAiPrompt(itemId);
    else if (verb === 'ai-delete') removeAiDraft(itemId);
    else if (verb === 'ai-candidate-import') importAiCandidate(itemId);
    else if (verb === 'ai-candidate-adopt') await adoptAiCandidate(itemId);
    else if (verb === 'ai-candidate-place') placeAiCandidate(itemId);
    else if (verb === 'ai-candidate-remove') removeAiCandidate(itemId);
    else if (verb === 'ai-candidate-scroll') document.getElementById('ai-candidates')?.scrollIntoView();
    else if (verb === 'ai-generate') await showWanGenerate(itemId);
    else if (verb === 'film-references') editCharacterReferences(itemId);
    else if (verb === 'film-shot') editFilmShot(Number(itemId));
    else if (verb === 'film-cues') editFilmCues(Number(itemId));
    else if (verb === 'film-job-add' || verb === 'film-job-edit') editFilmJob(itemId);
    else if (verb === 'film-job-result') importFilmJobResult(itemId);
    else if (verb === 'film-job-remove') removeFilmJob(itemId);
    else if (verb === 'film-play') await runFilm();
    else if (verb === 'film-mp4' || verb === 'film-webm') await runFilm(verb.slice(5));
    else if (verb === 'film-stop') filmPlayer?.abort?.abort();
    else if (verb === 'add' && view === 'assets') upload();
    else if (verb === 'add' || verb === 'edit') editItem(view, itemId);
    else if (verb === 'remove') removeItem(view, itemId);
    else if (verb === 'up' || verb === 'down') {
      button.disabled = true;
      try {
        await moveItem(view, itemId, verb === 'up' ? -1 : 1);
      } finally {
        button.disabled = false;
      }
    }
  } catch (error) {
    notify(report(error));
  }
});

window.addEventListener('hashchange', () => {
  if (editor.open && !submitting) editor.close();
  render(true).catch(error => notify(report(error)));
});

async function start() {
  try {
    database = await openDatabase();
    database.onversionchange = () => database.close();
    await render();
  } catch {
    const indicator = document.querySelector('.storage-status');
    indicator.classList.add('unavailable');
    indicator.innerHTML = '<span aria-hidden="true"></span>保存に接続できません';
    main.setAttribute('aria-busy', 'false');
    main.innerHTML = `<div class="page-head"><h1>スタジオを開けません</h1></div>
      ${empty(backupOnly ? 'このURLの保存領域にアクセスできませんでした。以前の公開版を使ったスマホとブラウザで開いてください。' : 'ブラウザの保存領域が利用できません。通常のブラウザタブでHTTPまたはHTTPSのアドレスを開き、再読み込みしてください。')}`;
  }
}

start();
</script>
